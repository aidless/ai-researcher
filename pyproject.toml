[project]
name = "ai-researcher"
version = "0.1.0"
description = "Envelope-bounded research loop with a signed evidence chain. Not a discovery claim and not a published package."
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
dependencies = ["cryptography>=41"]

[project.optional-dependencies]
dev = ["pytest>=7"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
