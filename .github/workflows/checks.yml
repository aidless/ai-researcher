name: checks
# Green means: unit tests under tests/, plus one offline fixture round
# (approve, synthetic result.json, Ed25519 verify, canned review).
# No API key and no network call is required.
# This workflow does not run scripts/gate.sh. That historical-bundle sweep
# is .github/workflows/evidence-integrity.yml, and a green badge here is
# not a venue verdict or a two-seat model review.
on: [push, pull_request]
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: install package and test runner
        run: python -m pip install -e ".[dev]"
      - name: unit tests
        run: python -m pytest tests -q
      - name: offline fixture (no API key)
        env:
          SILICONFLOW_API_KEY: ""
        run: python -m ai_researcher.offline_fixture
